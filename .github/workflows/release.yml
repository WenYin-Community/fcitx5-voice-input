name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 与 ci.yml 相同的构建矩阵（构建逻辑共用 .github/actions/build）
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            container: ubuntu:24.04
            onnx: download
            cpack: DEB
            git_cmd: apt-get update -qq && apt-get install -y -qq git
          - name: ubuntu-26.04
            container: ubuntu:26.04
            onnx: system
            cpack: DEB
            git_cmd: apt-get update -qq && apt-get install -y -qq git
          - name: debian-12
            container: debian:12
            onnx: download
            cpack: DEB
            git_cmd: apt-get update -qq && apt-get install -y -qq git
          - name: debian-13
            container: debian:13
            onnx: system
            cpack: DEB
            git_cmd: apt-get update -qq && apt-get install -y -qq git
          - name: fedora-44
            container: fedora:44
            onnx: system
            cpack: RPM
            git_cmd: dnf install -y git
          - name: opensuse-tumbleweed
            container: opensuse/tumbleweed
            onnx: system
            cpack: RPM
            git_cmd: zypper --non-interactive --gpg-auto-import-keys refresh && zypper --non-interactive install -y git
    steps:
      # 最小容器镜像不带 git，checkout 需要；同时为 actions/checkout 的
      # submodules 支持提供 git（REST 回退不支持 submodules）
      - name: Install git (container bootstrap)
        shell: bash
        run: ${{ matrix.git_cmd }}

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/build
        with:
          distro: ${{ matrix.name }}
          onnx_strategy: ${{ matrix.onnx }}
          cpack_generator: ${{ matrix.cpack }}

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: |
            *.deb
            *.rpm
          if-no-files-found: error

  verify:
    name: verify hardened addon loading
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install git (container bootstrap)
        shell: bash
        run: apt-get update -qq && apt-get install -y -qq git

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/build
        with:
          distro: ubuntu-24.04
          onnx_strategy: download
          run_verify: "true"

  arch:
    name: build (archlinux)
    runs-on: ubuntu-latest
    container: archlinux
    steps:
      - name: Install git (container bootstrap)
        shell: bash
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          pacman -Syu --noconfirm base-devel git cmake pkg-config gettext \
            fcitx5 pipewire libpulse jsoncpp curl onnxruntime-cpu

      # prepare.sh 用 git archive 生成源码包；容器内 checkout 文件属主与 git 用户
      # 可能不一致（宿主挂载场景），显式声明 safe.directory 避免 dubious ownership
      - name: Mark workspace as safe for git
        shell: bash
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - uses: ./.github/actions/aur

      - uses: actions/upload-artifact@v7
        with:
          name: package-arch
          path: |
            dist/aur/*.pkg.tar.zst
            dist/aur/PKGBUILD
            dist/aur/src/*.tar.gz
          if-no-files-found: error

  # AUR 发布：把 arch job 已经构建验证过的 PKGBUILD 推到 AUR。
  # 组织级 secret: AUR_SSH_PRIVATE_KEY（未配置时本 job 自动跳过）。
  aur-publish:
    name: Publish to AUR
    needs: [arch]
    runs-on: ubuntu-latest
    container: archlinux
    steps:
      - name: Install git and openssh (container bootstrap)
        shell: bash
        run: pacman -Syu --noconfirm git openssh

      - uses: actions/download-artifact@v7
        with:
          name: package-arch
          path: dist

      - name: Push PKGBUILD and .SRCINFO to AUR
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PKG=fcitx5-voice-input
          # 仅正式版本 tag 推送：预发布 tag 的源码归档地址不稳定
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "非正式版本 tag（${GITHUB_REF_NAME}），跳过 AUR 发布"
            exit 0
          fi
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "AUR_SSH_PRIVATE_KEY 未配置，跳过 AUR 发布"
            exit 0
          fi
          # download-artifact 取的是 dist/aur 下的相对路径，落到 dist/ 根
          if [ ! -f dist/PKGBUILD ]; then
            echo "::error::package-arch 产物缺少 PKGBUILD"
            exit 1
          fi
          PKGVER=$(sed -n 's/^pkgver=//p' dist/PKGBUILD | head -1)
          echo "AUR pkgver=${PKGVER}"

          # makepkg 拒绝以 root 运行，SSH key 与工作树都放在 builder 用户下
          if ! id builder >/dev/null 2>&1; then useradd -m builder; fi
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > /home/builder/.ssh/aur
          chown builder:builder /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n' \
            > /home/builder/.ssh/config
          chown builder:builder /home/builder/.ssh/config
          chmod 600 /home/builder/.ssh/config

          rm -rf /home/builder/aur
          runuser -u builder -- git clone "ssh://aur@aur.archlinux.org/${PKG}.git" /home/builder/aur

          # 防降级：以 AUR 仓库内 PKGBUILD 为准（RPC 元数据可能滞后于 git），
          # 新版本低于已发布版本时跳过（上游可能已单独跟进更高版本）
          EXISTING=$(sed -n 's/^pkgver=//p' /home/builder/aur/PKGBUILD 2>/dev/null | head -1)
          if [ -n "${EXISTING}" ] && [ "$(vercmp "${PKGVER}" "${EXISTING}")" -lt 0 ]; then
            echo "::warning::${PKGVER} 低于 AUR 已发布的 ${EXISTING}，跳过推送（避免降级）"
            exit 0
          fi

          install -m 644 -o builder -g builder dist/PKGBUILD /home/builder/aur/PKGBUILD
          runuser -u builder -- sh -c 'cd /home/builder/aur && makepkg --printsrcinfo > .SRCINFO'
          runuser -u builder -- git -C /home/builder/aur add PKGBUILD .SRCINFO

          if runuser -u builder -- git -C /home/builder/aur diff --cached --quiet; then
            echo "AUR 已是 ${PKGVER}，无需推送"
            exit 0
          fi
          runuser -u builder -- git -C /home/builder/aur \
            -c user.name='Wenyin Root' -c user.email='ruojiner@hotmail.com' \
            commit -m "update to ${PKGVER}"
          # 预检推送权限：AUR 只接受包维护者/共同维护者的 key，其余情况明确报错
          if ! runuser -u builder -- git -C /home/builder/aur push --dry-run origin master 2>/tmp/aur-push.err; then
            echo "::error::AUR 推送权限校验失败。请确认 AUR_SSH_PRIVATE_KEY 对应的账号是 ${PKG} 的维护者或共同维护者（当前维护者见 https://aur.archlinux.org/packages/${PKG}）"
            cat /tmp/aur-push.err
            exit 1
          fi
          runuser -u builder -- git -C /home/builder/aur push origin master

  # COPR 发布：CI 内构建自带全部源码的 SRPM 后提交给 COPR（Fedora/openSUSE 源）。
  # 组织级 secret: COPR_USERNAME / COPR_LOGIN / COPR_TOKEN（未配置时自动跳过）。
  copr-publish:
    name: Publish to COPR
    needs: [build]
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install git and packaging tools (container bootstrap)
        shell: bash
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build redhat-rpm-config copr-cli curl

      - uses: actions/checkout@v7

      - name: Build SRPM and submit to COPR
        shell: bash
        env:
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT || 'fcitx5-voice-input' }}
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "非正式版本 tag（${GITHUB_REF_NAME}），跳过 COPR 发布"
            exit 0
          fi
          if [ -z "${COPR_TOKEN:-}" ] || [ -z "${COPR_USERNAME:-}" ]; then
            echo "COPR 凭证未配置，跳过 COPR 发布"
            exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}"

          # rpmbuild -bs 只打包本地已存在的源：两个 Source 都先取到 SOURCES 下，
          # 名字必须与 spec 里 URL 的 basename 一致
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS
          curl -fsSL --retry 5 --retry-all-errors \
            "${BASE}/archive/refs/tags/v${VER}.tar.gz" \
            -o ~/rpmbuild/SOURCES/v${VER}.tar.gz

          MODEL_SHA=$(sed -n "s/^sha256sums=('SKIP' '\([0-9a-f]\{64\}\)')$/\1/p" aur/PKGBUILD | head -1)
          MODEL_COMMIT=$(awk '/^%global silero_vad_commit/ {print $3}' rpm/fcitx5-voice-input.spec)
          curl -fsSL --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/snakers4/silero-vad/${MODEL_COMMIT}/src/silero_vad/data/silero_vad.onnx" \
            -o ~/rpmbuild/SOURCES/silero_vad.onnx
          echo "${MODEL_SHA}  $HOME/rpmbuild/SOURCES/silero_vad.onnx" | sha256sum -c -

          sed "s/^Version:.*/Version:        ${VER}/" rpm/fcitx5-voice-input.spec \
            > ~/rpmbuild/SPECS/fcitx5-voice-input.spec
          rpmbuild -bs ~/rpmbuild/SPECS/fcitx5-voice-input.spec

          mkdir -p ~/.config
          {
            echo "[copr-cli]"
            echo "username = ${COPR_USERNAME}"
            echo "login = ${COPR_LOGIN}"
            echo "token = ${COPR_TOKEN}"
            echo "copr_url = https://copr.fedorainfracloud.org"
          } > ~/.config/copr
          chmod 600 ~/.config/copr

          PROJECT="${COPR_USERNAME}/${COPR_PROJECT}"
          # 不自动建项目：chroot 组合交给 COPR 网页端维护，避免猜错的 chroot 名
          # 让整个发布 job 失败
          if ! copr-cli get "${PROJECT}" >/dev/null 2>&1; then
            echo "::error::COPR 项目 ${PROJECT} 不存在，请先在 COPR 网页创建并勾选 chroot"
            exit 1
          fi
          copr-cli build --nowait "${PROJECT}" ~/rpmbuild/SRPMS/*.src.rpm

  release:
    name: Create draft release
    needs: [build, verify, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # softprops/action-gh-release v3（2026-07 恢复维护，含上传传输加固）；
      # 产物经 download-artifact merge 后位于 dist/ 下，files 支持 glob
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          name: fcitx5-voice-input ${{ github.ref_name }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/PKGBUILD
            dist/src/*.tar.gz
